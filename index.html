<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alan Daniel Méndez Jiménez — Portafolio</title>
<meta name="description" content="Portafolio de proyectos de Alan Daniel Méndez Jiménez, Ingeniería en Sistemas Computacionales, TecNM Celaya." />
<style>
  :root{
    --bg:#0d1117; --bg2:#161b22; --card:#1c2230; --line:#2a3140;
    --txt:#e6edf3; --muted:#9aa7b8; --accent:#3b82f6; --accent2:#22c55e;
    --amber:#f59e0b; --violet:#8b5cf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--txt);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}

  /* Hero */
  header{background:radial-gradient(1200px 400px at 50% -10%, #1d2b50 0%, var(--bg) 60%);
    border-bottom:1px solid var(--line);padding:64px 0 48px}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
  .avatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--violet));
    display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;color:#fff;
    object-fit:cover;border:2px solid rgba(255,255,255,.12);
    box-shadow:0 8px 30px rgba(59,130,246,.35)}
  h1{font-size:2rem;font-weight:700;letter-spacing:-.5px}
  .role{color:var(--muted);font-size:1.05rem}
  .contacts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line);
    border-radius:999px;padding:7px 15px;font-size:.9rem;color:var(--muted);transition:.2s}
  .chip:hover{border-color:var(--accent);color:var(--txt);transform:translateY(-1px)}

  /* Filters */
  .filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:38px 0 8px}
  .filter{background:var(--bg2);border:1px solid var(--line);color:var(--muted);border-radius:999px;
    padding:8px 18px;font-size:.9rem;cursor:pointer;transition:.2s}
  .filter:hover{color:var(--txt)}
  .filter.active{background:var(--accent);border-color:var(--accent);color:#fff}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin:28px 0 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;
    display:flex;flex-direction:column;gap:12px;transition:.25s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 34px rgba(0,0,0,.4)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .card h3{font-size:1.18rem;font-weight:700}
  .badge{font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0}
  .b-live{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.4)}
  .b-demo{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.4)}
  .b-code{background:rgba(139,92,246,.15);color:#a78bfa;border:1px solid rgba(139,92,246,.4)}
  .desc{color:var(--muted);font-size:.93rem;flex:1}
  .stack{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:.74rem;background:var(--bg);border:1px solid var(--line);color:var(--muted);
    border-radius:6px;padding:3px 9px}
  .actions{display:flex;gap:10px;margin-top:6px}
  .btn{flex:1;text-align:center;border-radius:9px;padding:9px 12px;font-size:.86rem;font-weight:600;
    border:1px solid var(--line);transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn-gh{background:var(--bg);color:var(--txt)}
  .btn-gh:hover{background:#21262d;border-color:var(--muted)}
  .btn-live{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn-live:hover{filter:brightness(1.1)}
  .btn[aria-disabled="true"]{opacity:.45;pointer-events:none}

  footer{border-top:1px solid var(--line);padding:30px 0;text-align:center;color:var(--muted);font-size:.88rem}
  footer a{color:var(--accent)}
  .hidden{display:none!important}
  @media(max-width:520px){h1{font-size:1.6rem}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="wrap hero">
    <img class="avatar" src="https://github.com/Alan20111.png?size=200" alt="Alan Daniel Méndez Jiménez" onerror="this.outerHTML='&lt;div class=\'avatar\'&gt;AM&lt;/div&gt;'" />
    <h1>Alan Daniel Méndez Jiménez</h1>
    <div class="role">Ingeniería en Sistemas Computacionales · TecNM Celaya<br>Desarrollador Full-Stack (Java &amp; Web)</div>
    <div class="contacts">
      <a class="chip" href="https://github.com/Alan20111" target="_blank" rel="noopener">⌨️ github.com/Alan20111</a>
      <a class="chip" href="mailto:alannicanor62@gmail.com">✉️ alannicanor62@gmail.com</a>
      <span class="chip">📍 Tarimoro, Guanajuato, México</span>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="filters">
    <button class="filter active" data-f="all">Todos</button>
    <button class="filter" data-f="web">Web</button>
    <button class="filter" data-f="desktop">Escritorio (Java)</button>
    <button class="filter" data-f="mobile">Móvil</button>
  </div>

  <section class="grid" id="grid"></section>
</main>

<footer>
  <div class="wrap">
    Hecho con ❤️ por Alan Méndez · <a href="https://github.com/Alan20111" target="_blank" rel="noopener">GitHub</a> ·
    <a href="mailto:alannicanor62@gmail.com">Contacto</a>
  </div>
</footer>

<script>
const GH = "https://github.com/Alan20111/";
const projects = [
  {
    name:"Vytaris", cat:"web", status:"live",
    desc:"Perfil médico de emergencia codificado dentro de un código QR. Sin servidores ni registro: los datos viajan en el propio QR para imprimir en un llavero.",
    stack:["HTML5","CSS3","JavaScript","qrcodejs"],
    gh:"Vytaris", live:"https://vytaris.vercel.app", liveLabel:"Ver en vivo"
  },
  {
    name:"MiPlaza", cat:"web", status:"demo",
    desc:"Sitio web para el supermercado MiPlaza: catálogo de productos por categorías, sección \"Nosotros\" y panel de administración. La app completa usa MySQL.",
    stack:["PHP","CodeIgniter 3","MySQL","Bootstrap"],
    gh:"Sitio_Web_Negocio", live:"https://mi-plaza.vercel.app", liveLabel:"Demo en vivo"
  },
  {
    name:"TreFoods", cat:"web", status:"demo",
    desc:"Sistema de gestión para una planta de producción: login de administrador y panel de pedidos, exportador y peticiones. El backend requiere hosting PHP + MySQL.",
    stack:["PHP","CodeIgniter 3","MySQL","Bootstrap"],
    gh:"Sistema_Gestion_De_Planta", live:"https://trefoods.vercel.app", liveLabel:"Demo visual"
  },
  {
    name:"Ajedrez con IA", cat:"desktop", status:"play",
    desc:"Juego de ajedrez en Java con una inteligencia artificial basada en el algoritmo Minimax con poda Alfa-Beta. Aquí puedes jugar una versión web contra la IA.",
    stack:["Java","IA","Minimax"],
    gh:"Ajedrez_IA", live:"https://ajedrez-ia.vercel.app/", liveLabel:"♟ Jugar demo"
  },
  {
    name:"Analizador Lineal", cat:"desktop", status:"terminal",
    desc:"Herramienta de consola en Java para álgebra lineal: combinación lineal (Ax=b), dependencia (LI/LD), conjunto generador (Span) y verificación de bases, con eliminación de Gauss.",
    stack:["Java","Álgebra lineal","Gauss"],
    gh:"Analizador_Lineal", live:"https://analizador-lineal.vercel.app/", liveLabel:"⌨️ Abrir terminal"
  },
  {
    name:"Administrador Gráfico Binario", cat:"desktop", status:"interactive",
    desc:"Sistema de inscripciones en Java Swing (Look&Feel Nimbus): registro de alumnos y materias, e inscripciones, con almacenamiento en archivos binarios.",
    stack:["Java","Swing","Archivos binarios"],
    gh:"Administrador_Grafico_Binario", live:"https://inscripciones-liard.vercel.app/", liveLabel:"🖥️ Abrir demo"
  },
  {
    name:"Monitor de Presión Arterial", cat:"desktop", status:"interactive",
    desc:"App de escritorio JavaFX (con MySQL) para registrar pacientes y dar seguimiento a sus mediciones de presión, con diagnóstico de IMC y clasificación de presión arterial.",
    stack:["JavaFX","MySQL"],
    gh:"Monitor_Presion_Arterial", live:"https://monitor-presion-three.vercel.app/", liveLabel:"🖥️ Abrir demo"
  },
  {
    name:"TodoListas!", cat:"desktop", status:"interactive",
    desc:"Gestor de tareas empresarial en JavaFX con backend en la nube Firebase Firestore: login, categorías, búsqueda y filtros, estadísticas (estado y categorías) y exportación de reportes PDF/Excel. Patrones MVC + DAO, Strategy/Factory y Singleton.",
    stack:["JavaFX","Firebase","MVC/DAO"],
    gh:"TodoListas", live:"https://todo-listas.vercel.app/", liveLabel:"🗂️ Abrir demo"
  },
  {
    name:"Perder Peso Corriendo", cat:"desktop", status:"interactive",
    desc:"Calculadora de sesiones de carrera en JavaFX (MVC): a partir de tu peso, velocidad (valor MET) y tiempo diario, estima calorías, horas totales y cuántas sesiones necesitas para alcanzar tu objetivo de pérdida de peso.",
    stack:["JavaFX","MVC"],
    gh:"Perder_Peso_Corriendo", live:"https://perder-peso.vercel.app/", liveLabel:"🖥️ Abrir demo"
  },
  {
    name:"GymMachine", cat:"mobile", status:"code",
    desc:"Aplicación de gimnasio multiplataforma (Android y escritorio con JavaFX) con backend en Firebase.",
    stack:["Kotlin","Java","JavaFX","Firebase"],
    gh:"GymMachine"
  },
  {
    name:"Hackathon", cat:"mobile", status:"code",
    desc:"Proyecto desarrollado en hackathon, multiplataforma con Flutter y componentes nativos.",
    stack:["Flutter","Dart","Kotlin","Swift"],
    gh:"Hackathon"
  }
];

const badgeMap = {
  live:{cls:"b-live", txt:"🟢 En vivo"},
  demo:{cls:"b-demo", txt:"🟡 Demo en vivo"},
  code:{cls:"b-code", txt:"🔵 Código"},
  play:{cls:"b-demo", txt:"🎮 Demo jugable"},
  interactive:{cls:"b-demo", txt:"🖥️ Demo interactivo"},
  terminal:{cls:"b-demo", txt:"⌨️ Demo terminal"},
  template:{cls:"b-code", txt:"🧩 Plantilla JavaFX"}
};

const grid = document.getElementById("grid");

function render(filter){
  grid.innerHTML = "";
  projects.filter(p=>filter==="all"||p.cat===filter).forEach(p=>{
    const b = badgeMap[p.status];
    const liveBtn = p.live
      ? `<a class="btn btn-live" href="${p.live}" target="_blank" rel="noopener">↗ ${p.liveLabel}</a>`
      : `<span class="btn btn-live" aria-disabled="true">Próximamente</span>`;
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <div class="card-top">
        <h3>${p.name}</h3>
        <span class="badge ${b.cls}">${b.txt}</span>
      </div>
      <p class="desc">${p.desc}</p>
      <div class="stack">${p.stack.map(s=>`<span class="tag">${s}</span>`).join("")}</div>
      <div class="actions">
        <a class="btn btn-gh" href="${GH+p.gh}" target="_blank" rel="noopener">⌨️ GitHub</a>
        ${liveBtn}
      </div>`;
    grid.appendChild(card);
  });
}

document.querySelectorAll(".filter").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    render(btn.dataset.f);
  });
});

render("all");
</script>
</body>
</html>
